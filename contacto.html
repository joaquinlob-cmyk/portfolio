<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto — Portfolio</title>
    <link rel="stylesheet" href="css/index.css" />
</head>

    <!--/ Header-->
    <header class="header">
        <div class="header__content">
            <a href="index.html" class="header__logo">
                <img src="" alt="Portfolio" />
            </a>

            <nav class="header__nav">
                <ul>
                    <li><a href="proyectos.html">Proyectos</a></li>
                    <li><a href="sobre-mi.html">Sobre mí</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <!--/ Header-->

    <main>

        <!--/ Hero-->
        <section class="hero">
            <div class="hero__content">
                <h1>Contacto</h1>
                <p>Información de contacto</p>
            </div>
        </section>
        <!--/ Hero-->

        <!--/ Contact-->
        <section class="contact">
            <div class="contact__content">

                <div class="contact__information">
                    <h2>Hablemos</h2>
                    <p>Texto de presentación</p>

                    <ul class="contact__list">

                        <li>
                            <h3>Email</h3>
                            <a href="mailto:">Email</a>
                        </li>

                        <li>
                            <h3>LinkedIn</h3>
                            <a href="#">LinkedIn</a>
                        </li>

                        <li>
                            <h3>GitHub</h3>
                            <a href="#">GitHub</a>
                        </li>

                    </ul>
                </div>

                <form class="contact__form" action="#" method="GET">

                    <div class="contact__form-row">

                        <div class="contact__form-field">
                            <label for="name">Nombre</label>
                            <input id="name" type="text" name="name" />
                        </div>

                        <div class="contact__form-field">
                            <label for="surname">Apellidos</label>
                            <input id="surname" type="text" name="surname" />
                        </div>

                    </div>

                    <div class="contact__form-field">
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email" />
                    </div>

                    <div class="contact__form-field">
                        <label for="subject">Asunto</label>
                        <input id="subject" type="text" name="subject" />
                    </div>

                    <div class="contact__form-field">
                        <label for="message">Mensaje</label>
                        <textarea id="message" name="message"></textarea>
                    </div>

                    <label class="contact__form-acceptance">
                        <input type="checkbox" name="acceptance" />
                        He leído y acepto la política de privacidad
                    </label>

                    <button type="submit">Enviar</button>

                </form>

            </div>
        </section>
        <!--/ Contact-->

    </main>

    <!--/ Footer-->
    <footer class="footer">
        <div class="footer__content">

            <div class="footer__logo">
                <img src="" alt="Portfolio" />

                <ul class="footer__social">
                    <li><a href="#" target="_blank" aria-label="Instagram"></a></li>
                    <li><a href="#" target="_blank" aria-label="LinkedIn"></a></li>
                    <li><a href="#" target="_blank" aria-label="GitHub"></a></li>
                    <li><a href="#" target="_blank" aria-label="Behance"></a></li>
                </ul>
            </div>

            <ul class="footer__legal">
                <li><a href="#">Aviso legal</a></li>
                <li><a href="#">Política de privacidad</a></li>
                <li><a href="#">Política de cookies</a></li>
            </ul>

        </div>
    </footer>
    <!--/ Footer-->

</body>

</html>
